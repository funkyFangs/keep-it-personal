[versions]

# Fabric
# check these on https://modmuss50.me/fabric.html
fabric-api = '0.146.1+26.1.2'
fabric-loader = '0.19.2'
fabric-loom = '1.16.1'
fabric-permissions-api = '0.7.0'

# Jackson
jackson = '3.1.1'
jackson-annotations = '2.21'

# Jakarta
jakarta = '3.0.0'

# Java
java = '25'

# Kotlin
kotlin = '2.3.20'

# Minecraft
minecraft = '26.1'

[libraries]

# Fabric
fabric-api = {group = 'net.fabricmc.fabric-api', name = 'fabric-api', version.ref = 'fabric-api'}
fabric-loader = {group = 'net.fabricmc', name = 'fabric-loader', version.ref = 'fabric-loader'}
fabric-permissions-api = {group = 'me.lucko', name = 'fabric-permissions-api', version.ref = 'fabric-permissions-api'}

# Jackson
jackson-annotations = {group = 'com.fasterxml.jackson.core', name = 'jackson-annotations', version.ref = 'jackson-annotations'}
jackson-bom = {group = 'tools.jackson', name = 'jackson-bom', version.ref = 'jackson'}
jackson-core = {group = 'tools.jackson.core', name = 'jackson-core', version.ref = 'jackson'}
jackson-databind = {group = 'tools.jackson.core', name = 'jackson-databind', version.ref = 'jackson'}
jackson-dataformat-toml = {group = 'tools.jackson.dataformat', name = 'jackson-dataformat-toml', version.ref = 'jackson'}

# Jakarta
jakarta-annotation-api = {group = 'jakarta.annotation', name = 'jakarta.annotation-api', version.ref = 'jakarta'}

# Minecraft
minecraft = {group = 'com.mojang', name = 'minecraft', version.ref = 'minecraft'}

[plugins]

# Fabric
fabric-loom = {id = 'net.fabricmc.fabric-loom', version.ref = 'fabric-loom'}

# Kotlin
kotlin-jvm = {id = 'org.jetbrains.kotlin.jvm', version.ref = 'kotlin'}

[bundles]

included = [
    'fabric-permissions-api',
    'jackson-annotations',
    'jackson-bom',
    'jackson-core',
    'jackson-databind',
    'jackson-dataformat-toml'
]
